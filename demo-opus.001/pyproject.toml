[project]
name = "aistack-demo"
version = "0.0.1"
description = "AiStackE2E one-day demo (demo-opus.001): Builder Mode slice for the Fusion Fuel RAG example"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
